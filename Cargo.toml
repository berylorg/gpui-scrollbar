[workspace]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.92"
version = "0.1.0"

[workspace.dependencies]
gpui = { git = "https://github.com/berylorg/zed-fork.git", rev = "b6939aa0a2d78be59facd12a909a4ada3b6f6a64", default-features = false, features = ["windows-manifest"] }

[package]
name = "gpui-scrollbar"
description = "Reusable app-neutral scrollbar primitives for GPUI applications."
edition.workspace = true
license.workspace = true
repository = "https://github.com/berylorg/gpui-scrollbar"
rust-version.workspace = true
version.workspace = true

[lib]
name = "gpui_scrollbar"
path = "src/lib.rs"

[dependencies]
gpui.workspace = true

[features]
test-support = []

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
